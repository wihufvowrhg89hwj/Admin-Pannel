<div view="{diagnosticsView}"><div widget="panel" title-label="{DIAGNOSTICS.DIAGNOSTICS}" instruction="{DIAGNOSTICS.DIAGNOSTICS_INSTRUCTION}"><div><div widget="combobox" data-bind="{diagnosticsModel.type}" data-options="{diagnosticToolStore}" label-field="{DIAGNOSTICS.DIAGNOSTIC_TOOLS}"></div><div widget="textbox" data-bind="{diagnosticsModel.ipaddr}" label-field="{DIAGNOSTICS.IP_DOMAIN}"></div><div widget="textbox" data-bind="{diagnosticsModel.count}" label-field="{DIAGNOSTICS.pingNum}"></div><div widget="textbox" data-bind="{diagnosticsModel.pktsize}" label-field="{DIAGNOSTICS.pingSize}" unit="{DIAGNOSTICS.BYTES}"></div><div widget="textbox" class="hidden" data-bind="{diagnosticsModel.ttl}" label-field="{DIAGNOSTICS.trHops}"></div><div widget="button" id="start-btn" class="panel-button full-line" data-bind="{startButton}" label-field="" text="{DIAGNOSTICS.START}"></div><div widget="button" id="stop-btn" class="panel-button full-line hidden" data-bind="{stopButton}" label-field="" text="{DIAGNOSTICS.STOP}"></div><div widget="information" data-bind="{diagnosticsResultStore}" class="block-separate"></div></div></div></div>
