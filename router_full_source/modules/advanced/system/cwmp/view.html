<div id="cwmp-view" view="{cwmpView}"><div widget="panel" title-label="{CWMP.TITLE}" instruction="" collapsible="{false}"><div widget="switch" id="cwmp-enable" data-bind="{cwmpModel.enable}" label-field="{CWMP.CWMP}" true-value="1" false-value="0"></div><div widget="fieldset" data-bind="{statusBind}"><div widget="switch" id="cwmp-inform-enable" data-bind="{cwmpModel.periodicInformEnable}" label-field="{CWMP.INFORM}" true-value="1" false-value="0"></div><div widget="textbox" id="cwmp-inform-interval" label-field="{CWMP.INFORM_INTERVAL}" data-bind="{cwmpModel.periodicInformInterval}" unit="{CWMP.SECONDS}"></div><div widget="combobox" id="data-model" label-field="{CWMP.DATA_MODEL}" data-bind="{cwmpModel.dataModel}" data-option="{cwmpDataModelS}"></div><div widget="textbox" id="cwmp-acs-url" label-field="{CWMP.ACS_URL}" data-bind="{cwmpModel.acsURL}"></div><div widget="textbox" id="cwmp-server-name" label-field="{CWMP.SERVER_NAME}" data-bind="{cwmpModel.TLS_SNI}" short-tips="{CWMP.OPTIONAL}"></div><div widget="textbox" id="cwmp-acs-username" label-field="{CWMP.ACS_USERNAME}" data-bind="{cwmpModel.acsUsername}"></div><div widget="password" id="cwmp-acs-password" label-field="{CWMP.ACS_PASSWORD}" data-bind="{cwmpModel.acsPassword}"></div><div widget="combobox" id="cwmp-interface" data-bind="{cwmpModel.interfaceType}" data-option="{interfaceClientStore}" label-field="{CWMP.INTERFACE_CLIENT}"></div><div widget="combobox" id="cwmp-conn-auth" data-bind="{cwmpModel.localAuthType}" data-option="{connRequestAuthStore}" label-field="{CWMP.CONNECTION_REQUEST_AUTH}"></div><div widget="textbox" id="cwmp-username" label-field="{CWMP.USERNAME}" data-bind="{cwmpModel.localUsername}"></div><div widget="password" id="cwmp-password" label-field="{CWMP.PASSWORD}" data-bind="{cwmpModel.localPassword}"></div><div widget="textbox" id="cwmp-path" label-field="{CWMP.PATH}" data-bind="{cwmpModel.localPath}"></div><div widget="textbox" id="cwmp-PORT" label-field="{CWMP.PORT}" data-bind="{cwmpModel.localPort}"></div></div></div></div>
