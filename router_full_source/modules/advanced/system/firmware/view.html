<div id="firmware-view" view="{firmwareView}"><div widget="panel" title-label="{FIRMWARE.TITLE}" collapsible="{false}" instruction="{FIRMWARE.TIPS}"><div><div widget="displaylabel" data-bind="{firmwareSetModel.firmwareVersion}" label-field="{FIRMWARE.FV}" class="elem-dir-ltr"></div><div widget="displaylabel" data-bind="{firmwareSetModel.hardwareVersion}" label-field="{FIRMWARE.HV}" class="elem-dir-ltr"></div><div widget="file" param-name="image" id="manual-upgrade-file" label-field="{FIRMWARE.NEW_FIRMWARE_FILE}" data-bind="{firmwareFile}" extension="bin"></div><div widget="button" id="local-upgrade-btn" class="full-line panel-button" data-bind="{localUpgradeBtn}" label-field="" text="{FIRMWARE.UPGRADE}"></div><div widget="notes" id="note" data-bind="{spaceNotEnoughNote}" class="hidden"></div></div></div><div widget="msg" type="window" data-bind="{progressbarWrap}" class="global-progress" close-btn="{false}"><div widget="progressbar" data-bind="{proBar}" class="label-empty global-progress" label-field="{false}"></div><div widget="paragraph" data-bind="{proBarTitle}" class="global-progress-under-text" label-field="{false}"></div></div><div widget="msg" type="confirm" id="firmware-upgrade-msg" data-bind="{confirmUpgrade}" class="global-confirm" yes-text="{FIRMWARE.UPGRADE}" no-text="{FIRMWARE.CANCEL}" msg="{FIRMWARE.UPDATE_CONFIRM}"></div><div widget="msg" type="alert" id="upgrade-fail-msg" data-bind="{upgradeFailMsg}" class="global-alert" close-btn="{false}" msg="{FIRMWARE.UPGRADE_FAIL}"></div></div>
