<div view="{pingWatchDogView}"><div widget="panel" title-label="{PING_WATCH_DOG.TITLE}" instruction="{PING_WATCH_DOG.INSTRUCTION}"><div widget="switch" id="pwd-enable" data-bind="{pingWatchDogModel.pingEnable}" label-field="{PING_WATCH_DOG.TITLE}" true-value="1" false-value="0"></div><div widget="fieldset" data-bind="{enablePwdBlock}" class="hidden"><div widget="textbox" data-bind="{pingWatchDogModel.pingIp}" label-field="{PING_WATCH_DOG.IP_ADDR_TO_PING}"></div><div widget="textbox" data-bind="{pingWatchDogModel.pingInterval}" label-field="{PING_WATCH_DOG.PING_INTERVAL}" unit="{UNIT.SECONDS}" short-tips="(10-300)"></div><div widget="textbox" data-bind="{pingWatchDogModel.startUpDelay}" label-field="{PING_WATCH_DOG.STARTUP_DELAY}" unit="{UNIT.SECONDS}" short-tips="(60-300)"></div><div widget="textbox" data-bind="{pingWatchDogModel.rebootCount}" label-field="{PING_WATCH_DOG.FAIL_COUNT}" short-tips="(1-65535)"></div></div></div></div>
