<div view="{lanAdvView}"><div widget="htmlLoader" id="lan-adv-lan-loader" data-bind="{lanAdvLanLoader}" child-module="lanAdvLan"></div><div widget="msg" type="prompt" id="lan-ip-change" class="global-confirm" data-bind="{lanIpChangeMsg}" close-btn="{false}" ok-text="{NETWORK_LAN.OK_UPPERCASE}"><div widget="paragraph" text="{NETWORK_LAN.LAN_IP_CHANGE_MSG}"></div></div><div widget="msg" type="window" id="lan-reboot-animate" class="global-progress" data-bind="{lanAdvRebootAnimate}" close-btn="{false}"><div widget="fieldset"><div class="reboot-animate global-progress-animate-img" alt="reboot" widget="img" img-src="{loading}" style="display:block;width:42px;height:42px;margin:0 auto"></div></div><div widget="paragraph" class="global-progress-under-text" text="{NETWORK_LAN.REBOOT_ANIMATE}"></div></div><div widget="msg" type="alert" id="lan-select-two" class="global-alert" data-bind="{lanSelectTwoMsg}" close-btn="{false}"><div widget="paragraph" text="{NETWORK_LAN.SELECT_TWO}"></div></div></div><div view="{lanAdvLanView}"><div widget="panel" title-label="{NETWORK_LAN.LAN}" collapsible="{false}" instruction="{NETWORK_LAN.LAN_INSTRUCTION}"><div widget="displaylabel" data-bind="{lanAdvLanModel.macaddr}" label-field="{NETWORK_LAN.MAC}" class="mac-display-label"></div><div widget="ip" id="lanAdvIpAddr" data-bind="{lanAdvLanModel.ipaddr}" label-field="{NETWORK_LAN.IP}"></div><div widget="combobox" data-options="{lanAdvSubnetCombo}" data-bind="{lanAdvLanModel.maskType}" label-field="{NETWORK_LAN.SUBNET}"></div><div widget="ip" id="subnetCustom" class="hidden" data-bind="{lanAdvLanModel.customValue}"></div></div></div>
