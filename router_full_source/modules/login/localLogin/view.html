<div view="{localLoginView}" class="login-card-wrap switch-btn-wrap"><div widget="panel" title-label="{LOGIN.LOCAL_LOGIN}" data-bind="mainPanel" class="login-card"><div widget="password" id="local-pwd-tb" data-bind="{localLoginControl.password}" label-field="{LOGIN.LOCAL_PASSWORD}" allow-visible="{true}"></div><div widget="button" id="local-login-button" data-bind="{localLoginBtn}" class="full-line label-empty" text="{LOGIN.LOGIN_BUTTON_TEXT}"></div><div widget="paragraph" class="local-login-retry-note hidden" data-bind="{loginRetryNote}" text="{LOGIN.LOGIN_RETRY_SG}"></div><div class="transition-container forget-pwd-container"><a widget="transition" class="local-login-forget-pwd jump-label">{LOGIN.FORGET_PWD}</a><div widget="paragraph" class="forget-pwd-p hidden" data-bind="forgetPwdP" text="{LOGIN.loginPwdReset}"></div></div><div widget="paragraph" id="local-login-no-internet-tips" data-bind="noInternetTips" class="error-paragraph"></div><div class="local-login-switch-to-tp-container"><a widget="transition" class="local-login-switch-to-tp jump-label hidden" data-bind="switchToTp"><span class="icon"></span><span class="text">{LOGIN.TP_LOGIN}</span></a></div></div></div>
