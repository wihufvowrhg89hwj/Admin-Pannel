<div view="{basicDeviceView}" class="basic-device-container"><div widget="panel" class="networkmap-panel networkmap-client-panel" title-label="{NETWORK_MAP.CONNECTED_CLIENTS}" collapsible="{false}"><div widget="button" id="map-clients-access-control-btn" class="link-button inline-block panel-header-button" data-bind="{mapClientsAccessControlBtn}" label-field="{false}" text="{NETWORK_MAP.VIEW_BLACKLIST}"></div><div widget="grid" data-bind="{connectedClientsStore}" id="connected-clients-grid" class="connected-clients-grid" auto-min-height="{false}"></div></div><div widget="msg" type="prompt" id="client-name-msg" msg-view="basicDeviceView" data-bind="{clientNameMsg}" class="editor-container" msg-title="{NETWORK_MAP.EDIT}"><div widget="textbox" data-bind="{clientNameModelAlias}" label-field="{NETWORK_MAP.DEVICE_NAME}"></div><div widget="textbox" read-only="{true}" data-bind="{clientNameModelMac}" label-field="{NETWORK_MAP.MAC_ADDRESS}"></div></div><div widget="msg" type="confirm" id="block-confirm-msg" class="global-confirm" data-bind="{blockConfirmMsg}" msg="{NETWORK_MAP.BLOCK_MSG_BLACKLIST}" yes-text="{NETWORK_MAP.BLOCK_UPPERCASE}" no-text="{NETWORK_MAP.CANCEL}"></div><div widget="msg" id="speed-limit-msg" msg-view="basicDeviceView" data-bind="{speedLimitMsg}" class="editor-container" msg-title="{BASIC_DEVICE.SPEED_LIMIT}" ok-text="{OPERATION.SAVE_UPPERCASE}"><div widget="fieldset"><div widget="paragraph" class="text-gray" data-bind="{speedLimitTip}" text="{BASIC_DEVICE.SPEED_LIMIT_TIP}"></div><div widget="checkbox" id="speed-limit-enable" class="em" label-field="{BASIC_DEVICE.SPEED_LIMIT}" box-label="{BASIC_DEVICE.ENABLE}" data-bind="{speedLimitModel.slEnable}" true-value="1" false-value="0"></div><div widget="fieldset" data-bind="{speedLimitEditBlock}"><div widget="combobox" data-bind="{speedLimitModel.downloadLimitType}" data-options="{speedLimitDownloadStore}" label-field="{BASIC_DEVICE.DOWNLOAD_LIMIT}" tips="{BASIC_DEVICE.SPEED_1_MBPS_TIPS}"></div><div widget="combination" data-bind="{downloadLimitCustom}" class="bandwidth-set-item time-container"><div widget="textbox" data-bind="{speedLimitModel.downloadLimit}" label-field="{false}" tips="(1-1024)"></div><div widget="combobox" data-bind="{speedLimitModel.downloadLimitUnit}" label-field="{false}" data-options="{bandwidthUnitStore}"></div></div><div widget="combobox" id="speed-upload-limit-comb" data-bind="{speedLimitModel.uploadLimitType}" data-options="{speedLimitUploadStore}" label-field="{BASIC_DEVICE.UPLOAD_LIMIT}"></div><div widget="combination" data-bind="{uploadLimitCustom}" class="bandwidth-set-item time-container"><div widget="textbox" data-bind="{speedLimitModel.uploadLimit}" label-field="{false}" tips="(1-1024)"></div><div widget="combobox" data-bind="{speedLimitModel.uploadLimitUnit}" label-field="{false}" data-options="{bandwidthUnitStore}"></div></div></div></div></div><div widget="msg" id="speedlimit-priority-conflict-msg" msg-view="basicDeviceView" data-bind="{speedLimitPriorityMsg}" class="global-alert z-index-1000-msg" msg-title="{BASIC_DEVICE.SPEED_LIMIT}" ok-text="{BASIC_DEVICE.TURN_ON}"><div widget="paragraph" text="{BASIC_DEVICE.TURN_ON_SPEED}"></div><div widget="paragraph" text="{BASIC_DEVICE.LIMIT_PRIORITY_CONFLICT}"></div></div></div>
