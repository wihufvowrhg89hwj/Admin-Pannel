aylabel" class="em hidden" label-field="{NETWORK_MAP.WIRELESS_5GHZ}" data-bind="{wispDisplay}"></div><div widget="displaylabel" data-bind="{wirelessMap5gModel.ssid}" label-field="{NETWORK_MAP.NETWORK_NAME_SSID}"></div><div widget="displaylabel" data-bind="{wirelessMap5gModel.password}" label-field="{NETWORK_MAP.PASSWORD}"></div><div widget="displaylabel" data-bind="{uChannel5g}" label-field="{NETWORK_MAP.CHANNEL}"></div></div></div><div widget="panel" id="guest-panel" class="networkmap-panel" title-label="{NETWORK_MAP.GUEST_NETWORK}" collapsible="{false}"><div widget="button" id="map-router-guest-button" class="icon-button edit-icon-btn inline-block panel-header-button" label-field="{false}" text="{NETWORK_MAP.EDIT}"></div><div class="networkmap-panel-column"><div widget="switch" id="guestNetwork2g-enable-switch" class="em" data-bind="{guestNetworkMap.enable}" label-field="{NETWORK_MAP.WIRELESS_24GHZ}" true-value="1" false-value="0"></div><div widget="displaylabel" data-bind="{guestNetworkMap.ssid}" label-field="{NETWORK_MAP.NETWORK_NAME_SSID}"></div></div><div id="guest-5g-panel" class="networkmap-panel-column hidden"><div widget="switch" id="guestNetwork5g-enable-switch" class="em" data-bind="{guestNetworkMap5g.enable}" label-field="{NETWORK_MAP.WIRELESS_5GHZ}" true-value="1" false-value="0"></div><div widget="displaylabel" data-bind="{guestNetworkMap5g.ssid}" label-field="{NETWORK_MAP.NETWORK_NAME_SSID}"></div></div></div><div widget="panel" id="interface-list-panel" class="networkmap-panel hidden" title-label="{NETWORK_MAP.ETHERNET_STATUS}" collapsible="{false}" data-bind="{ethernet}"><div widget="interfaceList" data-bind="{ethernetStatusStore}"></div></div></div></div>
