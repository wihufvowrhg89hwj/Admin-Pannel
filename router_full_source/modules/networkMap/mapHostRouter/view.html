<div view="{mapRouterView}"><div widget="fieldset"><div widget="panel" id="wireless-panel" class="networkmap-panel" title-label="{NETWORK_MAP.HOST_NETWORK}" collapsible="{false}"><div widget="button" id="map-router-wireless-button" class="icon-button edit-icon-btn inline-block panel-header-button" label-field="{false}" text="{NETWORK_MAP.EDIT}"></div><div id="wireless-2g-panel" class="networkmap-panel-column"><div widget="switch" disable-not-set-gray="{true}" hover-tip-text="{NETWORK_MAP.LEAST_ONE_BAND_NOTICE}" id="wireless2g-enable-switch" class="em" data-bind="{hostNetworkRouter.bBridgeEnabled}" label-field="{NETWORK_MAP.WIRELESS_24GHZ}" true-value="1" false-value="0"></div><div widget="displaylabel" data-bind="{hostNetworkRouter.cBridgedSsid}" label-field="{NETWORK_MAP.SSID}"></div><div widget="displaylabel" data-bind="{hostNetworkRouter.cPassWD}" label-field="{NETWORK_MAP.PASSWORD}"></div><div widget="displaylabel" data-bind="{hostNetworkRouter.cBridgedBssid}" label-field="{NETWORK_MAP.MAC_ADDRESS}" class="mac-display-label"></div></div><div id="wireless-5g-panel" class="networkmap-panel-column hidden"><div widget="switch" disable-not-set-gray="{true}" hover-tip-text="{NETWORK_MAP.LEAST_ONE_BAND_NOTICE}" id="wireless5g-enable-switch" class="em" data-bind="{hostNetworkRouter5g.bBridgeEnabled}" label-field="{NETWORK_MAP.WIRELESS_5GHZ}" true-value="1" false-value="0"></div><div widget="displaylabel" data-bind="{hostNetworkRouter5g.cBridgedSsid}" label-field="{NETWORK_MAP.SSID}"></div><div widget="displaylabel" data-bind="{hostNetworkRouter5g.cPassWD}" label-field="{NETWORK_MAP.PASSWORD}"></div><div widget="displaylabel" data-bind="{hostNetworkRouter5g.cBridgedBssid}" label-field="{NETWORK_MAP.MAC_ADDRESS}" class="mac-display-label"></div></div></div></div></div>
