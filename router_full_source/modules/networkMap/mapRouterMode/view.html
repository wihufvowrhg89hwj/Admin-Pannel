<div view="{mapRouterModeView}" class="network-map-container"><div widget="fieldset" class="map-top-container"><div id="map-internet" widget="transition" data-bind="{mapInternet}" class="map-item map-internet"><div class="map-internet-icon-container"><div class="map-internet-icon"><span class="map-internet-icon-status hidden"></span></div></div><p class="map-item-text map-internet-text"><span>{NETWORK_MAP.INTERNET}</span></p></div><div class="map-item map-line"><div class="map-line-inner"></div></div><div id="map-router" widget="transition" data-bind="{mapRouter}" class="map-item map-router"><div class="map-router-icon-container"><div class="map-router-icon"></div></div><p class="map-item-text map-router-text"><span>{productName}</span></p></div><div class="map-item map-line"><div widget="transition" class="map-router-bar"><div id="wireless-2g-item" class="map-router-item-container wireless-item wireless-2g-item"><span class="text">{NETWORK_MAP.G24}</span><div class="icon"></div></div><div id="wireless-5g-item" class="hidden map-router-item-container wireless-5g-item wireless-item"><span class="text">{NETWORK_MAP.G5}</span><div class="icon"></div></div></div><div class="map-line-inner"></div></div><div id="map-clients" widget="transition" data-bind="{mapClients}" class="map-item map-clients"><div class="map-clients-icon-container"><div class="map-clients-icon"><span class="map-clients-icon-num"></span></div></div><p class="map-item-text map-clients-text"><span>{NETWORK_MAP.CLIENTS}</span></p></div></div><div widget="fieldset"><div widget="htmlLoader" id="map-internet-loader" data-bind="{mapInternetLoader}" child-module="mapInternet"></div><div widget="htmlLoader" id="map-router-loader" data-bind="{mapRouterLoader}" child-module="mapRouter"></div><div widget="htmlLoader" id="map-clients-loader" data-bind="{mapClientsLoader}" child-module="basicDevice"></div></div></div>
